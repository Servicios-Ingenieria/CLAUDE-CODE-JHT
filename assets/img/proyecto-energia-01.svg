  <text x="400" y="560" font-family="Arial, sans-serif" font-size="13" fill="#ff7b1c" text-anchor="middle" letter-spacing="2">IMAGEN REFERENCIAL — REEMPLAZAR EN PRODUCCIÓN</text>
