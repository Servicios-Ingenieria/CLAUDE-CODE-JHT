  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#ff7b1c" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="400" y="288" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROYECTO ENERGÍA</text>
