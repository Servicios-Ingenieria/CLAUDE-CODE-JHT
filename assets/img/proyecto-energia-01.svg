      <stop offset="0%" stop-color="#0e2b47"/>
      <stop offset="100%" stop-color="#12161a"/>
    </linearGradient>
    <pattern id="diag" width="26" height="26" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
