<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 600"
     role="img"
     aria-label="Applus Norcontrol">

  <defs>

    <!-- Fondo degradado -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a444d"/>
      <stop offset="100%" stop-color="#12161a"/>
    </linearGradient>

    <!-- Líneas diagonales -->
    <pattern id="diag"
             width="26"
             height="26"
             patternTransform="rotate(45)"
             patternUnits="userSpaceOnUse">

      <rect width="26"
            height="26"
            fill="transparent"/>

      <line x1="0"
            y1="0"
            x2="0"
            y2="26"
            stroke="#9aa3ab"
            stroke-width="6"
            stroke-opacity="0.12"/>

    </pattern>

  </defs>


  <!-- ================================= -->
  <!-- FONDO -->
  <!-- ================================= -->

  <rect width="800"
        height="600"
        fill="url(#g)"/>

  <rect width="800"
        height="600"
        fill="url(#diag)"/>


  <!-- ================================= -->
  <!-- MARCO -->
  <!-- ================================= -->

  <rect x="24"
        y="24"
        width="752"
        height="552"
        fill="none"
        stroke="#9aa3ab"
        stroke-opacity="0.35"
        stroke-width="2"
        stroke-dasharray="10 8"/>


  <!-- ================================= -->
  <!-- LOGO APPLUS NORCONTROL -->
  <!-- ================================= -->

  <image
      href="imagenes/Applus-norcontrol.jpg"
      x="150"
      y="190"
      width="500"
      height="220"
      preserveAspectRatio="xMidYMid meet"/>


  <!-- ================================= -->
  <!-- TEXTO INFERIOR -->
  <!-- ================================= -->

  <text
      x="400"
      y="560"
      font-family="Arial, sans-serif"
      font-size="13"
      fill="#9aa3ab"
      text-anchor="middle"
      letter-spacing="2">

      APPLUS NORCONTROL

  </text>

</svg>
